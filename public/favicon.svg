<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    :root {
      --bg: #09090b;
      --fg: #ffffff;
      --border: rgba(255, 255, 255, 0.2);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #ffffff;
        --fg: #09090b;
        --border: rgba(0, 0, 0, 0.2);
      }
    }
    .badge-bg {
      fill: var(--bg);
      stroke: var(--border);
      stroke-width: 1.2;
    }
    .pulse-line {
      fill: none;
      stroke: var(--fg);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
  <rect class="badge-bg" x="1.5" y="1.5" width="29" height="29" rx="7.5" />
  <g transform="translate(4, 4)">
    <path class="pulse-line" d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2" />
  </g>
</svg>